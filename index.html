<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #F6F4EF;
    --paper-alt: #EDE9E0;
    --ink: #26221D;
    --ink-soft: #6F6A60;
    --line: #DEDACE;
    --sage: #4B7F52;
    --sage-deep: #375D3C;
    --sage-tint: #E4EEE3;
    --amber: #D98E3F;
    --amber-deep: #B06F27;
    --amber-tint: #F7E9D4;
    --cook-bg: #201C18;
    --cook-panel: #2B2621;
    --cook-ink: #F3EEE4;
    --cook-ink-soft: #B8AFA1;
    --radius-card: 20px;
    --radius-pill: 999px;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    overscroll-behavior-y: contain;
  }
  #app{ max-width: 560px; margin: 0 auto; min-height: 100vh; position:relative; padding-bottom: 24px; }

  button{ font-family: inherit; cursor:pointer; border:none; background:none; color:inherit; }
  button:focus-visible, a:focus-visible{ outline: 2px solid var(--sage-deep); outline-offset: 2px; }

  /* ---------- HOME ---------- */
  .home-header{ padding: 28px 20px 10px; }
  .home-header h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 32px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .home-header p{
    margin:0; color: var(--ink-soft); font-size: 15px;
  }

  .grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: 14px;
    padding: 16px 20px 12px;
  }
  .card{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 0;
    text-align:left;
    overflow:hidden;
    display:flex; flex-direction:column;
    transition: transform .15s ease;
  }
  .card:active{ transform: scale(0.97); }
  .card-icon{
    aspect-ratio: 1 / 0.82;
    display:flex; align-items:center; justify-content:center;
    background: var(--paper-alt);
  }
  .card-icon svg{ width: 62%; height: 62%; }
  .card-body{ padding: 12px 14px 16px; }
  .card-title{
    font-family: var(--font-display); font-weight: 600;
    font-size: 17px; line-height:1.2; margin: 0 0 4px;
  }
  .card-meta{ font-size: 12.5px; color: var(--ink-soft); margin:0; }

  .empty-state{
    margin: 24px 20px; padding: 28px 20px;
    border: 1px dashed var(--line); border-radius: var(--radius-card);
    text-align:center; color: var(--ink-soft); font-size: 14px;
  }

  /* ---------- DETAIL ---------- */
  .screen{ display:none; }
  .screen.active{ display:block; }

  .topbar{
    display:flex; align-items:center; gap: 10px;
    padding: 16px 16px 4px;
  }
  .back-btn{
    width:38px; height:38px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--paper-alt); flex-shrink:0;
  }
  .back-btn svg{ width:18px; height:18px; }

  .detail-hero{
    margin: 4px 20px 0; border-radius: var(--radius-card);
    background: var(--paper-alt); display:flex; align-items:center; justify-content:center;
    aspect-ratio: 16/9;
  }
  .detail-hero svg{ width: 40%; height: 40%; }

  .detail-body{ padding: 18px 20px 140px; }
  .detail-title{
    font-family: var(--font-display); font-weight: 700;
    font-size: 27px; line-height:1.15; margin: 0 0 6px;
  }
  .detail-sub{ color: var(--ink-soft); font-size: 14.5px; margin: 0 0 18px; }

  .meta-row{
    display:flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px;
  }
  .meta-pill{
    background: var(--sage-tint); color: var(--sage-deep);
    border-radius: var(--radius-pill); padding: 7px 13px;
    font-size: 12.5px; font-weight: 600; display:flex; align-items:center; gap:6px;
  }

  .section-label{
    font-size: 13px; font-weight: 700; text-transform: none;
    color: var(--ink); margin: 0 0 10px; letter-spacing: 0;
  }

  .ingredient-list{ list-style:none; margin:0 0 26px; padding:0; }
  .ingredient-list li{
    display:flex; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  .ingredient-list li:last-child{ border-bottom:none; }
  .ingredient-list .amt{ color: var(--ink-soft); white-space:nowrap; }
  .ingredient-list li.ing-group{
    display:block; border-bottom:none; padding: 16px 0 6px;
    font-size: 12.5px; font-weight: 700; color: var(--sage-deep);
  }
  .ingredient-list li.ing-group:first-child{ padding-top: 0; }

  .notes-box{
    background: var(--paper-alt); border-radius: 14px; padding: 14px 16px;
    font-size: 13.8px; color: var(--ink-soft); line-height:1.5;
  }

  .cta-dock{
    position: fixed; left:0; right:0; bottom:0;
    max-width: 560px; margin: 0 auto;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--paper) 60%, transparent);
  }
  .cta-btn{
    width:100%; background: var(--sage); color:#fff;
    padding: 16px 20px; border-radius: var(--radius-pill);
    font-size: 16px; font-weight: 700;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow: 0 8px 20px rgba(75,127,82,0.35);
  }
  .cta-btn:active{ transform: scale(0.98); }
  .cta-btn svg{ width:18px; height:18px; }

  /* ---------- COOK MODE ---------- */
  #screen-cook{
    position: fixed; inset:0; background: var(--cook-bg); color: var(--cook-ink);
    display:none; flex-direction:column; z-index: 50;
    max-width: 560px; margin: 0 auto;
  }
  #screen-cook.active{ display:flex; }

  .cook-top{ padding: calc(14px + env(safe-area-inset-top)) 20px 12px; }
  .cook-top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cook-exit{
    width:36px; height:36px; border-radius:50%; background: rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center;
  }
  .cook-exit svg{ width:16px; height:16px; stroke: var(--cook-ink); }
  .cook-step-count{ font-size: 13px; color: var(--cook-ink-soft); font-weight:600; }

  .progress-track{
    height:4px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow:hidden;
  }
  .progress-fill{ height:100%; background: var(--amber); border-radius:4px; transition: width .25s ease; }

  .cook-main{ flex:1; overflow-y:auto; padding: 8px 24px 20px; display:flex; flex-direction:column; }
  .cook-step-title{
    font-family: var(--font-display); font-weight: 600;
    font-size: 26px; line-height:1.2; margin: 18px 0 14px;
  }
  .cook-step-text{ font-size: 18px; line-height:1.55; color: var(--cook-ink); margin:0; flex-shrink:0; }

  .ingredient-chips{
    display:flex; flex-wrap:wrap; gap: 8px; margin-top: 14px;
  }
  .ingredient-chip{
    background: var(--cook-panel); border-radius: var(--radius-pill);
    padding: 7px 13px; font-size: 13px; color: var(--cook-ink-soft);
    display:flex; align-items:baseline; gap: 5px; white-space:nowrap;
  }
  .ingredient-chip .amt{ color: var(--amber); font-weight:700; margin-left: 5px; }

  .timer-box{
    margin-top: 26px; background: var(--cook-panel); border-radius: 20px;
    padding: 22px; display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .timer-display{
    font-family: var(--font-display); font-size: 44px; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  }
  .timer-display.running{ color: var(--amber); }
  .timer-display.done{ color: var(--sage); }
  .timer-label{ font-size: 12.5px; color: var(--cook-ink-soft); margin-top:-8px; }
  .timer-controls{ display:flex; gap: 10px; }
  .timer-btn{
    padding: 10px 18px; border-radius: var(--radius-pill);
    background: rgba(255,255,255,0.08); color: var(--cook-ink);
    font-size: 14px; font-weight:700;
  }
  .timer-btn.primary{ background: var(--amber); color: #201C18; }

  .long-step-note{
    margin-top:22px; display:flex; align-items:center; gap:10px;
    background: var(--cook-panel); border-radius:14px; padding:12px 16px;
    font-size: 13.5px; color: var(--cook-ink-soft);
  }
  .long-step-note svg{ width:18px; height:18px; flex-shrink:0; }

  .cook-nav{
    display:flex; gap: 10px; padding: 14px 20px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .nav-btn{
    flex:1; padding: 15px; border-radius: var(--radius-pill); font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .nav-btn.prev{ background: rgba(255,255,255,0.08); color: var(--cook-ink); }
  .nav-btn.next{ background: var(--sage); color:#fff; }
  .nav-btn.finish{ background: var(--amber); color:#201C18; }
  .nav-btn[disabled]{ opacity: 0.35; pointer-events:none; }

  .done-screen{ text-align:center; padding: 60px 30px; }
  .done-screen svg{ width:56px; height:56px; margin-bottom:18px; }
  .done-screen h2{ font-family: var(--font-display); font-size:26px; margin:0 0 8px; }
  .done-screen p{ color: var(--cook-ink-soft); font-size:14.5px; margin:0 0 26px; }
</style>

</head>
<body>
<div id="app">

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="home-header">
      <h1>Recetario</h1>
      <p id="home-sub">Elegí una receta para empezar.</p>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <!-- DETAIL -->
  <div id="screen-detail" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()" aria-label="Volver">
        <svg viewBox="0 0 24 24" fill="none" stroke="#26221D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div id="detail-hero" class="detail-hero"></div>
    <div class="detail-body">
      <h2 id="detail-title" class="detail-title"></h2>
      <p id="detail-sub" class="detail-sub"></p>
      <div id="detail-meta" class="meta-row"></div>

      <p class="section-label">Ingredientes</p>
      <ul id="detail-ingredients" class="ingredient-list"></ul>

      <p class="section-label">Notas</p>
      <div id="detail-notes" class="notes-box"></div>
    </div>
    <div class="cta-dock">
      <button class="cta-btn" onclick="startCooking()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        EMPEZAR A COCINAR
      </button>
    </div>
  </div>

  <!-- COOK MODE -->
  <div id="screen-cook">
    <div class="cook-top">
      <div class="cook-top-row">
        <button class="cook-exit" onclick="exitCooking()" aria-label="Salir">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <span id="cook-step-count" class="cook-step-count"></span>
      </div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    </div>
    <div id="cook-main" class="cook-main"></div>
    <div id="cook-nav" class="cook-nav"></div>
  </div>

</div>

  // ---------- STATE ----------
  const RECIPES_BASE = 'recipes/'; // carpeta con index.json + un .json por receta
  let recipes = [];               // metadata liviana (grilla): id, icon, title, subtitle, servings
  let recipeCache = {};           // recetas completas ya descargadas, por id
  let currentRecipe = null;
  let cookStepIndex = 0;
  let timerInterval = null;
  let timerRemaining = 0;   // segundos restantes (siempre recalculado desde timerEndTime)
  let timerTotal = 0;       // duración total del paso actual, para reiniciar
  let timerEndTime = null;  // timestamp real de fin mientras el timer corre
  let timerRunning = false;
  let wakeLock = null;      // evita que se bloquee la pantalla con el timer corriendo

  // ---------- CARGA DE RECETAS (dinámica: recipes/index.json) ----------
  async function loadRecipes() {
    try {
      const res = await fetch(RECIPES_BASE + 'index.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      recipes = await res.json();
    } catch (e) {
      console.warn('No se pudo cargar recipes/index.json, uso datos de reserva.', e);
      recipes = SEED_RECIPES_FALLBACK.map(r => ({ id: r.id, icon: r.icon, title: r.title, subtitle: r.subtitle, servings: r.servings }));
      SEED_RECIPES_FALLBACK.forEach(r => { recipeCache[r.id] = r; });
    }
  }

  // ---------- RENDER: HOME ----------
  function renderHome() {
    const grid = document.getElementById('grid');
    document.getElementById('home-sub').textContent =
      recipes.length ? 'Elegí una receta para empezar.' : 'Todavía no hay recetas cargadas.';
    if (!recipes.length) {
      grid.innerHTML = '';
      grid.insertAdjacentHTML('afterend', `<div class="empty-state">Pedime en el chat que sume una receta y va a aparecer acá.</div>`);
      return;
    }
    grid.innerHTML = recipes.map(r => `
      <button class="card" onclick="openRecipe('${r.id}')">
        <div class="card-icon">${ICONS[r.icon] || ICONS.tortilla}</div>
        <div class="card-body">
          <p class="card-title">${r.title}</p>
          <p class="card-meta">${r.servings}</p>
        </div>
      </button>
    `).join('');
  }

  // ---------- RENDER: DETAIL ----------
  async function openRecipe(id) {
    // Pantalla de detalle en estado "cargando" mientras se resuelve el JSON completo
    showScreen('detail');
    document.getElementById('detail-hero').innerHTML = ICONS[(recipes.find(r=>r.id===id)||{}).icon] || ICONS.tortilla;
    document.getElementById('detail-title').textContent = (recipes.find(r=>r.id===id)||{}).title || 'Cargando…';
    document.getElementById('detail-sub').textContent = '';
    document.getElementById('detail-meta').innerHTML = '';
    document.getElementById('detail-ingredients').innerHTML = '';
    document.getElementById('detail-notes').textContent = '';

    let full = recipeCache[id];
    if (!full) {
      try {
        const res = await fetch(RECIPES_BASE + id + '.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        full = await res.json();
        recipeCache[id] = full;
      } catch (e) {
        console.warn('No se pudo cargar la receta ' + id, e);
        document.getElementById('detail-title').textContent = 'No se pudo cargar la receta';
        document.getElementById('detail-notes').textContent = 'Revisá tu conexión e intentá de nuevo.';
        return;
      }
    }

    currentRecipe = full;
    document.getElementById('detail-hero').innerHTML = ICONS[currentRecipe.icon] || ICONS.tortilla;
    document.getElementById('detail-title').textContent = currentRecipe.title;
    document.getElementById('detail-sub').textContent = currentRecipe.subtitle || '';
    document.getElementById('detail-meta').innerHTML = `
      <span class="meta-pill">${currentRecipe.servings}</span>
      <span class="meta-pill">${currentRecipe.time}</span>
      <span class="meta-pill">${currentRecipe.oven}</span>
    `;
    document.getElementById('detail-ingredients').innerHTML = currentRecipe.ingredients.map(i =>
      i.group
        ? `<li class="ing-group">${i.group}</li>`
        : `<li><span>${i.name}</span><span class="amt">${i.amount}</span></li>`
    ).join('');
    document.getElementById('detail-notes').textContent = currentRecipe.notes || '';
  }

  function goHome() { showScreen('home'); }

  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    window.scrollTo(0, 0);
  }

  // ---------- COOK MODE ----------
  function startCooking() {
    if (!currentRecipe) return;
    cookStepIndex = 0;
    document.getElementById('screen-cook').classList.add('active');
    renderCookStep();
  }

  function exitCooking() {
    clearTimerInterval();
    document.getElementById('screen-cook').classList.remove('active');
  }

  function renderCookStep() {
    clearTimerInterval();
    const steps = currentRecipe.steps;
    const main = document.getElementById('cook-main');
    const nav = document.getElementById('cook-nav');

    if (cookStepIndex >= steps.length) {
      main.innerHTML = `
        <div class="done-screen">
          ${CHECK_ICON}
          <h2>¡Listo!</h2>
          <p>Terminaste todos los pasos de ${currentRecipe.title}.</p>
        </div>`;
      nav.innerHTML = `<button class="nav-btn finish" onclick="exitCooking()">Volver al recetario</button>`;
      document.getElementById('cook-step-count').textContent = '';
      document.getElementById('progress-fill').style.width = '100%';
      return;
    }

    const step = steps[cookStepIndex];
    document.getElementById('cook-step-count').textContent = `Paso ${cookStepIndex + 1} de ${steps.length}`;
    document.getElementById('progress-fill').style.width = `${((cookStepIndex) / steps.length) * 100}%`;

    let chipsHtml = '';
    if (step.ingredientRefs && step.ingredientRefs.length) {
      const byId = {};
      (currentRecipe.ingredients || []).forEach(i => { if (i.id) byId[i.id] = i; });
      const chips = step.ingredientRefs
        .map(id => byId[id])
        .filter(Boolean)
        .map(i => `<span class="ingredient-chip"><span>${i.name}</span><span class="amt">${i.amount}</span></span>`)
        .join('');
      if (chips) chipsHtml = `<div class="ingredient-chips">${chips}</div>`;
    }

    let extra = '';
    if (step.timer) {
      // Al volver de Atajos, esta URL hace que la web se reabra directo en este
      // mismo paso (ver resumeCookingFromURL en el init), no en la pantalla de inicio.
      const returnUrl = `${location.origin}${location.pathname}?recipe=${encodeURIComponent(currentRecipe.id)}&step=${cookStepIndex}`;
      const shortcutUrl = `shortcuts://x-callback-url/run-shortcut?name=Timer%20Receta&amp;input=text&amp;text=${step.timer}&amp;x-success=${encodeURIComponent(returnUrl)}&amp;x-cancel=${encodeURIComponent(returnUrl)}`;
      extra = `
        <div class="timer-box">
          <div id="timer-display" class="timer-display">${formatTime(step.timer)}</div>
          <div class="timer-label" id="timer-label">Tocá empezar cuando arranques este paso</div>
          <div class="timer-controls">
            <button class="timer-btn primary" id="timer-toggle" onclick="toggleTimer(${step.timer})">Empezar</button>
            <button class="timer-btn" onclick="resetTimer(${step.timer})">Reiniciar</button>
          </div>
          <a class="timer-btn" style="margin-top:8px;width:100%;box-sizing:border-box;display:block;text-align:center;text-decoration:none" href="${shortcutUrl}">⏰ Timer del sistema (Atajos)</a>
        </div>`;
    } else if (step.longStep) {
      extra = `
        <div class="long-step-note">
          ${HOURGLASS_ICON}
          <span>Paso largo de espera — no hace falta quedarse mirando el timer.</span>
        </div>`;
    }

    main.innerHTML = `
      <h2 class="cook-step-title">${step.title}</h2>
      <p class="cook-step-text">${step.text}</p>
      ${chipsHtml}
      ${extra}
    `;

    nav.innerHTML = `
      <button class="nav-btn prev" ${cookStepIndex === 0 ? 'disabled' : ''} onclick="prevStep()">Atrás</button>
      <button class="nav-btn next" onclick="nextStep()">${cookStepIndex === steps.length - 1 ? 'Terminar' : 'Siguiente'}</button>
    `;

    clearTimerInterval();
    releaseWakeLock();
    if (step.timer) {
      timerRemaining = step.timer;
      timerTotal = step.timer;
      timerEndTime = null;
      timerRunning = false;
    }
  }

  function nextStep() { cookStepIndex++; renderCookStep(); }
  function prevStep() { if (cookStepIndex > 0) { cookStepIndex--; renderCookStep(); } }

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function clearTimerInterval() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* no soportado o permiso denegado: seguimos igual, solo no evitamos el bloqueo */ }
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  function toggleTimer(total) {
    const display = document.getElementById('timer-display');
    const label = document.getElementById('timer-label');
    const btn = document.getElementById('timer-toggle');
    if (timerRunning) {
      // Pausar: el restante real siempre se calcula contra el timestamp de fin
      timerRemaining = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
      timerRunning = false;
      timerEndTime = null;
      clearTimerInterval();
      releaseWakeLock();
      btn.textContent = 'Continuar';
      display.classList.remove('running');
      return;
    }
    if (timerRemaining <= 0) timerRemaining = total;
    timerTotal = total;
    timerEndTime = Date.now() + timerRemaining * 1000;
    timerRunning = true;
    requestWakeLock();
    btn.textContent = 'Pausar';
    display.classList.add('running');
    label.textContent = 'Corriendo…';
    clearTimerInterval();
    timerInterval = setInterval(updateTimerDisplay, 250);
    updateTimerDisplay();
  }

  function updateTimerDisplay() {
    if (!timerRunning || timerEndTime === null) return;
    const display = document.getElementById('timer-display');
    if (!display) { clearTimerInterval(); return; } // cambiamos de paso/pantalla
    timerRemaining = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
    display.textContent = formatTime(timerRemaining);
    if (timerRemaining <= 0) finishTimer();
  }

  function finishTimer() {
    clearTimerInterval();
    releaseWakeLock();
    timerRunning = false;
    timerEndTime = null;
    timerRemaining = 0;
    const display = document.getElementById('timer-display');
    const label = document.getElementById('timer-label');
    const btn = document.getElementById('timer-toggle');
    if (display) { display.textContent = formatTime(0); display.classList.remove('running'); display.classList.add('done'); }
    if (label) label.textContent = '¡Listo este paso!';
    if (btn) btn.textContent = 'Empezar';
    playBeep();
    if (navigator.vibrate) navigator.vibrate([200, 80, 200]);
  }

  function resetTimer(total) {
    clearTimerInterval();
    releaseWakeLock();
    timerRunning = false;
    timerEndTime = null;
    timerRemaining = total;
    timerTotal = total;
    const display = document.getElementById('timer-display');
    if (display) {
      display.textContent = formatTime(total);
      display.classList.remove('running', 'done');
    }
    const label = document.getElementById('timer-label');
    if (label) label.textContent = 'Tocá empezar cuando arranques este paso';
    const btn = document.getElementById('timer-toggle');
    if (btn) btn.textContent = 'Empezar';
  }

  // Si volvemos a la app (se desbloqueó el teléfono, se volvió de otra app) con el
  // timer corriendo, recalculamos al toque contra el timestamp real y recuperamos
  // el wake lock si se perdió al pasar a segundo plano.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && timerRunning) {
      updateTimerDisplay();
      if (timerRunning) requestWakeLock();
    }
  });

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.6);
    } catch (e) { /* audio not available, ignore */ }
  }

  // Si volvemos de Atajos (ver el link "Timer del sistema"), la URL trae
  // ?recipe=<id>&step=<índice>: saltamos directo a ese paso en modo cocina
  // en vez de mostrar la pantalla de inicio.
  async function resumeCookingFromURL() {
    const params = new URLSearchParams(location.search);
    const rid = params.get('recipe');
    if (!rid) return;
    const stepIdx = parseInt(params.get('step') || '0', 10);
    await openRecipe(rid);
    if (currentRecipe) {
      cookStepIndex = Number.isFinite(stepIdx) && stepIdx >= 0 ? stepIdx : 0;
      showScreen('cook');
      renderCookStep();
    }
    // Limpiamos la URL para que un refresh manual no vuelva a saltar al mismo paso
    history.replaceState({}, '', location.pathname);
  }

  // ---------- INIT ----------
  (async function init() {
    await loadRecipes();
    renderHome();
    await resumeCookingFromURL();
  })();
</script>
